 var f=document.createElement('iframe');f.className='fx';f.style.bottom=b+'px';f.src='../'+(r[0]?'t3menu.html?fx='+r[0]+'&v=3'+r[1]:'menu.html?v=t3'+r[1]);document.body.appendChild(f)});
