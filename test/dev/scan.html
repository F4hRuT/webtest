<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Проход по странице под меню</title>
<style>
/* Checking aid: a picture of the bank main page (402 pt wide) as the page, our menu over it. ?oy=&step=&every=&n= scrolls
   oy + k*step every `every` s for n steps and shows k as a 14-bit code at 10..106 x 100..106 pt (red ends), like the iOS test
   app, so screenshots of both can be paired. ?noicons hides our icons/labels (the iOS app hides its own). */
:root{color-scheme:dark}
html,body{margin:0;background:#000}
#pg{display:block;width:402px;margin:0 auto}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5px);z-index:20;width:100%;height:80px;visibility:hidden}
@supports (top:100svh){.dock{bottom:auto;top:calc(100svh - env(safe-area-inset-bottom,0px) - 85px)}}
.edgefill{position:fixed;left:0;right:0;bottom:0;height:4px;z-index:19;background:#000}
#code{position:fixed;left:10px;top:100px;width:96px;height:6px;z-index:30;display:none}
#code i{position:absolute;top:0;width:6px;height:6px}
.noicons #itb-base,.noicons #itb-lensedge{visibility:hidden}
</style></head><body>
<main class="app" id="app"><img id="pg" src="../ref/page_main.png" alt=""></main>
<div class="edgefill"></div><div id="code"></div>
<script>
var Q=location.search,P=function(n,d){var m=new RegExp('[?&]'+n+'=([\\d.]+)').exec(Q);return m?+m[1]:d};
if(/[?&]noicons/.test(Q))document.documentElement.className='noicons';
var oy=P('oy',0),step=P('step',0),every=P('every',2),n=P('n',0),code=document.getElementById('code');
function setCode(k){var h='';for(var b=0;b<16;b++){var c=b===0||b===15?'#f00':(((k>>(b-1))&1)?'#fff':'#262626');h+='<i style="left:'+(b*6)+'px;background:'+c+'"></i>'}code.innerHTML=h;code.style.display='block'}
window.ITBH={sel:function(){},ready:function(){document.getElementById('dock').style.visibility='visible'}};
setTimeout(function(){document.getElementById('dock').style.visibility='visible'},3000);
document.getElementById('pg').onload=function(){window.scrollTo(0,oy);if(/[?&]code/.test(Q))setCode(0);
 if(n>0){var k=0,t=setInterval(function(){k++;if(k>=n){clearInterval(t);return}window.scrollTo(0,oy+k*step);setCode(k)},every*1000)}};
</script>
<div class="dock" id="dock" role="navigation" aria-label="Меню разделов"></div><script src="menu.js?v=s23"></script>
</body></html>
