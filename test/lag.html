<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Проверка отставания стекла</title>
<style>
/* Lag test for the menu glass: a long page of horizontal bands (period 120 px). In a screen recording the band phase
   of the page (above the menu) and of the glass (inside the menu) is measured frame by frame; their difference is the lag. */
:root{color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:#000}
.app{position:relative;width:100%;background:#000}
.app i{position:absolute;left:0;right:0;display:block;background:#fff}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5px);z-index:20;display:block;width:100%;height:80px;visibility:hidden;border:0;background:transparent;color-scheme:dark}
@supports (top:100svh){.dock{bottom:auto;top:calc(100svh - env(safe-area-inset-bottom,0px) - 85px)}}
.edgefill{position:fixed;left:0;right:0;bottom:0;width:100%;height:4px;z-index:19;pointer-events:none;background-color:#000}
</style></head><body>
<main class="app" id="app"></main>
<div class="edgefill" aria-hidden="true"></div>
<script>
(function(){
var app=document.getElementById('app'),n=+((/[?&]n=(\d+)/.exec(location.search)||[])[1]||40),P=120,W=+((/[?&]w=(\d+)/.exec(location.search)||[])[1]||36),h='';
if(/[?&]bc/.test(location.search)){
 /* "barcode": white bands of random height and gap (fixed seed), so the page position can be read without ambiguity */
 var a=12345>>>0,rnd=function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296},y=200;
 while(y<6000){var hh=Math.round(12+rnd()*60),gg=Math.round(30+rnd()*120);h+='<i style="top:'+y+'px;height:'+hh+'px"></i>';y+=hh+gg}
 app.style.height=(y+400)+'px'}
else{app.style.height=(n*P+400)+'px';
for(var i=0;i<n;i++)h+='<i style="top:'+(200+i*P)+'px;height:'+W+'px"></i>'}
/* ?r=x,y,w,h,R,G,B,rad;... rectangles in iOS screen points (tab bar top at 791), placed so they sit the same way under our bar */
var rq=(/[?&]r=([^&]+)/.exec(location.search)||[])[1],iq=(/[?&]img=([^&]+)/.exec(location.search)||[])[1];
/* ?img=file,y : a picture 1206 px wide (3x screenshot crop) at iOS y (pt); inserted as a data URL — the glass snapshot cannot load files */
function oyOf(){var d=document.getElementById('dock'),t=d?parseFloat(getComputedStyle(d).top):NaN;return isFinite(t)?t+15-791:-147}
if(iq){var pp=decodeURIComponent(iq).split(','),L=new Image();L.crossOrigin='anonymous';L.onload=function(){var c=document.createElement('canvas');c.width=L.width;c.height=L.height;c.getContext('2d').drawImage(L,0,0);
 var im=document.createElement('img');im.src=c.toDataURL('image/png');im.style.cssText='position:absolute;left:0;top:'+(+pp[1]+oyOf())+'px;width:402px';app.appendChild(im)};L.src=pp[0]}
if(rq)document.addEventListener('DOMContentLoaded',function(){var oy=oyOf(),q='';
 decodeURIComponent(rq).split(';').forEach(function(t){var v=t.split(',').map(Number);if(v.length<7)return;q+='<i style="left:'+v[0]+'px;right:auto;top:'+(v[1]+oy)+'px;width:'+v[2]+'px;height:'+v[3]+'px;background:rgb('+v[4]+','+v[5]+','+v[6]+')'+(v[7]?';border-radius:'+v[7]+'px':'')+'"></i>'});
 app.insertAdjacentHTML('beforeend',q)});
app.innerHTML=h;
window.ITBH={sel:function(){},ready:function(){document.getElementById('dock').style.visibility='visible'}};
setTimeout(function(){document.getElementById('dock').style.visibility='visible'},3000);
/* ?block: keep the page script busy 150 ms of every 200 ms (the glass must still move with the page) */
if(/[?&]block/.test(location.search))setInterval(function(){var t=performance.now();while(performance.now()-t<150){}},200);
})();
</script>
<div class="dock" id="dock" role="navigation" aria-label="Меню разделов"></div><script src="../menu.js?v=115"></script>
</body></html>
