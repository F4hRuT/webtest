<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Проверка отставания стекла</title>
<style>
/* Lag test for the menu glass: a long page of horizontal bands (period 120 px). In a screen recording the band phase
   of the page (above the menu) and of the glass (inside the menu) is measured frame by frame; their difference is the lag. */
:root{color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:#000}
.app{position:relative;width:100%;background:#000}
.app i{position:absolute;left:0;right:0;display:block;background:#fff}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5px);z-index:20;display:block;width:100%;height:80px;visibility:hidden;border:0;background:transparent;color-scheme:dark}
@supports (top:100svh){.dock{bottom:auto;top:calc(100svh - env(safe-area-inset-bottom,0px) - 85px)}}
.edgefill{position:fixed;left:0;right:0;bottom:0;width:100%;height:4px;z-index:19;pointer-events:none;background-color:#000}
</style></head><body>
<main class="app" id="app"></main>
<div class="edgefill" aria-hidden="true"></div>
<script>
(function(){
var app=document.getElementById('app'),n=+((/[?&]n=(\d+)/.exec(location.search)||[])[1]||40),P=120,W=+((/[?&]w=(\d+)/.exec(location.search)||[])[1]||36),h='';
app.style.height=(n*P+400)+'px';
for(var i=0;i<n;i++)h+='<i style="top:'+(200+i*P)+'px;height:'+W+'px"></i>';
app.innerHTML=h;
window.ITBH={sel:function(){},ready:function(){document.getElementById('dock').style.visibility='visible'}};
setTimeout(function(){document.getElementById('dock').style.visibility='visible'},3000);
/* ?block: keep the page script busy 150 ms of every 200 ms (the glass must still move with the page) */
if(/[?&]block/.test(location.search))setInterval(function(){var t=performance.now();while(performance.now()-t<150){}},200);
})();
</script>
<div class="dock" id="dock" role="navigation" aria-label="Меню разделов"></div><script src="../menu.js?v=100"></script>
</body></html>
