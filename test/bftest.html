<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#000;color:#fff;font:16px -apple-system}
.c{height:120px;display:flex}.c i{flex:1}
.t{position:relative;height:60px;margin:6px;border:1px solid #444}
.t span{position:absolute;left:4px;top:4px;font-size:12px;z-index:2}
.box{position:absolute;inset:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="inv" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="1 0"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="table" tableValues="1 0"/></feComponentTransfer></filter>
<filter id="dsp" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feTurbulence baseFrequency="0.05" numOctaves="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div id="o" style="font-size:12px;white-space:pre"></div>
<div style="position:relative">
<div class="c"><i style="background:#f00"></i><i style="background:#0f0"></i><i style="background:#00f"></i><i style="background:#fff"></i><i style="background:linear-gradient(#b6d70a,#000)"></i></div>
<div style="position:absolute;left:0;right:0;top:10px;height:100px;display:flex;flex-direction:column">
 <div class="t"><span>blur css</span><div class="box" style="-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)"></div></div>
</div></div>
<div style="position:relative;margin-top:8px">
<div class="c"><i style="background:#f00"></i><i style="background:#0f0"></i><i style="background:#00f"></i><i style="background:#fff"></i><i style="background:linear-gradient(#b6d70a,#000)"></i></div>
<div style="position:absolute;left:0;right:0;top:10px;height:100px"><div class="t"><span>url(#inv)</span><div class="box" style="-webkit-backdrop-filter:url(#inv);backdrop-filter:url(#inv)"></div></div></div></div>
<div style="position:relative;margin-top:8px">
<div class="c"><i style="background:#f00"></i><i style="background:#0f0"></i><i style="background:#00f"></i><i style="background:#fff"></i><i style="background:linear-gradient(#b6d70a,#000)"></i></div>
<div style="position:absolute;left:0;right:0;top:10px;height:100px"><div class="t"><span>url(#dsp)</span><div class="box" style="-webkit-backdrop-filter:url(#dsp);backdrop-filter:url(#dsp)"></div></div></div></div>
<script>var b=document.querySelectorAll('.box'),o=document.getElementById('o');o.textContent='supports url(): '+CSS.supports('backdrop-filter','url(#inv)')+' / -webkit-: '+CSS.supports('-webkit-backdrop-filter','url(#inv)')+'\ncomputed: '+[].map.call(b,function(x){var s=getComputedStyle(x);return s.backdropFilter||s.webkitBackdropFilter}).join(' | ')</script>
</body></html>
