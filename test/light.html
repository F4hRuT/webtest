.sw button[aria-pressed=true]{background:var(--fg);color:#fff}
#st{margin-top:10px;font-size:12px;color:var(--mut)}

@supports (top:100svh){.dock{bottom:auto;top:calc(100svh - env(safe-area-inset-bottom,0px) - 85px)}}

.win>*{position:absolute;left:0;top:0;width:368px;height:70px}
.bar{overflow:visible}
.bar path{fill:#fff}
.sh{filter:drop-shadow(0 6px 14px rgba(0,0,0,.10)) drop-shadow(0 0 1px rgba(0,0,0,.10))}
.cap{left:0;top:8px;width:99.55px;height:54px;transition:transform .48s cubic-bezier(.3,1.35,.5,1)}
.cap path{fill:rgba(0,0,0,.06)}
.tabs{left:4px;top:4px;width:360px;height:62px}
.tab{position:absolute;top:0;height:62px;margin:0;padding:0;border:0;background:none;color:var(--fg);font:inherit;cursor:pointer;outline:0;-webkit-appearance:none;appearance:none}
.tab svg{position:absolute;overflow:visible}
.tab .lb{position:absolute;left:-10px;right:-10px;top:39.3px;text-align:center;font-size:10px;line-height:12px;font-weight:500;white-space:nowrap;letter-spacing:.01em}
.tab.on{color:var(--act)}
/* HDR layers: the glow colour is about 1000 nits (page white is about 203), the screen shows as much as it can */
.hdr{pointer-events:none;dynamic-range-limit:no-limit;-webkit-dynamic-range-limit:no-limit}
.rim{opacity:1}
.prs{opacity:0;transition:opacity .45s ease-out}
.win.down .prs{opacity:1;transition:opacity .08s ease-out}
video.hdr{object-fit:fill;-webkit-mask-size:100% 100%;mask-size:100% 100%}
#vrim{-webkit-mask-image:url(hdr/rim_mask.png);mask-image:url(hdr/rim_mask.png)}
#vprs{-webkit-mask-image:url(hdr/press_mask.png);mask-image:url(hdr/press_mask.png)}
body[data-m=img] video.hdr,body[data-m=vid] img.hdr,body[data-m=off] .hdr{display:none}

<div id="st"></div>
</main>

  <video class="hdr prs" id="vprs" src="hdr/white_pq.mp4" muted playsinline loop autoplay preload="auto" aria-hidden="true"></video>
 </div>
</div>
