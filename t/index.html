<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тест чёткости меню</title>
<style>
html,body{margin:0;background:#000;color:#fff;font:15px/1.4 -apple-system,system-ui,sans-serif}
.lbl{height:28px;box-sizing:border-box;line-height:20px;position:relative;z-index:30;padding:4px 12px;color:#b6d70a;font-weight:600;font-size:13px}
.fx{position:fixed;left:0;right:0;width:100%;height:100px;border:0;background:transparent;z-index:20}
.st{display:block;width:100%;height:100px;border:0;background:transparent}
.tag{position:fixed;left:8px;z-index:40;color:#b6d70a;font:600 13px -apple-system,sans-serif;background:#000;padding:2px 6px;border-radius:6px}
#info{position:fixed;top:0;right:0;z-index:50;background:rgba(0,0,0,.85);color:#7CFC00;font:11px/1.35 Menlo,monospace;padding:6px 8px;white-space:pre;max-width:60vw;overflow:hidden}
.fill p{margin:0 16px 10px;color:#aaa}
</style></head><body>
<div class="lbl">1 — iframe в потоке страницы (не закреплён)</div>
<iframe class="st" id="f1" src="../menu.html?v=t1"></iframe>
<div class="lbl">2 — iframe в потоке, у меню убран will-change и позиция округлена до пикселя</div>
<iframe class="st" id="f2" src="../menu.html?v=t2"></iframe>
<div class="fill" id="fill"></div>
<span class="tag" style="bottom:300px">3 — закреплён как в банке</span>
<iframe class="fx" id="f3" style="bottom:200px" src="../menu.html?v=t3"></iframe>
<span class="tag" style="bottom:200px">4 — закреплён, без will-change, позиция округлена</span>
<iframe class="fx" id="f4" style="bottom:100px" src="../menu.html?v=t4"></iframe>
<span class="tag" style="bottom:100px">5 — закреплён, у меню нет transform вообще, округлена</span>
<iframe class="fx" id="f5" style="bottom:0" src="../menu.html?v=t5"></iframe>
<div id="info"></div>
<script>
var h='';for(var i=0;i<60;i++)h+='<p>Строка текста страницы для прокрутки №'+(i+1)+' — Главная Тариф Расходы Поддержка</p>';document.getElementById('fill').innerHTML=h;
function fix(id,opt){var f=document.getElementById(id);f.addEventListener('load',function(){setTimeout(function(){var d=f.contentDocument,b=d.getElementById('bar');
 if(opt.nowc){b.style.willChange='auto'}
 if(opt.notf){var st=d.createElement('style');st.textContent='#bar{transform:none!important;will-change:auto!important}';d.head.appendChild(st)}
 if(opt.snap){var r=b.getBoundingClientRect();b.style.left=(Math.round(r.left)-r.left)+'px';b.style.top=(Math.round(r.top)-r.top)+'px'}
 info()},3000)})}
fix('f2',{nowc:1,snap:1});fix('f4',{nowc:1,snap:1});fix('f5',{nowc:1,snap:1,notf:1});
document.getElementById('f5').addEventListener('load',function(){var w=document.getElementById('f5').contentWindow;try{w.devicePixelRatio}catch(_){}});
function info(){var s='DPR '+devicePixelRatio+'  inner '+innerWidth+'x'+innerHeight+'\n';['f1','f2','f3','f4','f5'].forEach(function(id){try{var f=document.getElementById(id),d=f.contentDocument,b=d.getElementById('bar'),c=d.getElementById('base'),r=b.getBoundingClientRect(),cr=c.getBoundingClientRect(),fr=f.getBoundingClientRect();
 s+=id+' frame y'+fr.top.toFixed(2)+' bar x'+r.left.toFixed(3)+' y'+r.top.toFixed(3)+' w'+r.width.toFixed(2)+' cv '+c.width+'x'+c.height+' css '+cr.width.toFixed(2)+' @x'+cr.left.toFixed(3)+' tf '+(b.style.transform||'-')+'\n'}catch(e){s+=id+' err '+e+'\n'}});document.getElementById('info').textContent=s}
setInterval(info,1500);
</script></body></html>
